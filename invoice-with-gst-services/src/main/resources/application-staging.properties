spring.application.name=invoice-with-gst-services
server.port=8085
server.address=0.0.0.0
#spring.datasource.url=jdbc:mysql://localhost:3306/nsv_schema
#spring.datasource.username=root
#spring.datasource.password=MyNewPassword123!
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Auth0 JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI}

# Optional: Enable debug logs for troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

spring.cloud.compatibility-verifier.enabled=false