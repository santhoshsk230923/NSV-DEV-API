spring.application.name=dispatch-service
server.port=8089
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auth0 JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI}


auth0.client-id=${AUTH0.CLIENT_ID}
auth0.client-secret=${AUTH0.CLIENT_SECRET}
auth0.token-uri=${AUTH0.CLIENT_URI}
auth0.audience=${AUTH0.CLIENT_AUDIENCE}

# URLs of other microservices
supply.url=${SUPPLY_URL}
processing.url=${F_PROCESSING_URL}
dispatch.url=${DISPATCH_URL}
invoice.url=${INVOICE_URL}
transactions.url=${TRANSACTION_URL}