# Server Configuration
server.port=8083

# Spring Application Name
spring.application.name=supplier-service

# Database Configuration
server.address=0.0.0.0
spring.datasource.url=jdbc:mysql://localhost:3306/nsv_schema
spring.datasource.username=root
spring.datasource.password=MyNewPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# OAuth2 Resource Server JWT config
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-csgurp4hmblyo844.us.auth0.com/

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev-csgurp4hmblyo844.us.auth0.com/.well-known/jwks.json

# Optional: Enable debug logs for troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG


